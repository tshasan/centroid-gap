name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/demo _site/paper
          cp demo/index.html _site/index.html
          cp paper/main.pdf _site/paper/main.pdf
          cat <<'EOF' > _site/demo/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=../">
          <link rel="canonical" href="https://tshasan.github.io/centroid-gap/">
          <title>Redirecting to Centroid Gap CG-1</title>
          <script>location.replace("../");</script>
          </head>
          <body><p>Redirecting to <a href="../">Centroid Gap CG-1</a>…</p></body>
          </html>
          EOF
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
